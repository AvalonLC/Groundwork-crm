name: ci
on:
  push: { branches: [main, 'agent/**'] }
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    # A hung step used to sit until the 6-hour default. On 2026-08-19 the
    # Playwright install below wedged against an unreachable Ubuntu mirror and
    # ran 2h35m before anyone stopped it, blocking four PRs. Ten minutes is
    # roughly 2x the slowest healthy run (512s), so a real slowdown still
    # passes and a hang fails fast enough to retry.
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: validate task graph
        run: node scripts/validate-tasks.js
      - name: validate finance config files
        run: npm run validate:finance-config
      - name: guard - no wrangler --remote in source
        # Matched to .githooks/pre-push's actual pattern (wrangler + --remote
        # on the same line) rather than a bare '--remote' substring search --
        # the broader check would also flag legitimate mentions, e.g.
        # scripts/migrate-finance-data.mjs, which takes --remote as a CLI
        # flag Tyler passes himself and never runs a bare wrangler --remote
        # command from within source.
        run: |
          ! grep -rnE 'wrangler.*--remote' src/ scripts/ 2>/dev/null || exit 1
      - name: guard - no DB_PROD in source
        run: |
          ! grep -rn 'DB_PROD' src/ scripts/ 2>/dev/null || exit 1
      - name: guard - no float money in finance migrations
        # Strips SQL '--' comments before matching so English prose that
        # happens to contain the word "real" (e.g. "a real foreign key",
        # "job_id now a real FK" in migrations/0057_finance_merge.sql's own
        # comments) doesn't false-positive as a REAL-typed column. \b word
        # boundaries added for the same reason (avoid matching inside longer
        # identifiers). This guard was silently red on every push since
        # Stage 1 (commit 4beee83, which first added
        # migrations/0057_finance_merge.sql to its scope) purely on this
        # false positive — found and fixed 2026-08-11; there was never an
        # actual float column, confirmed by re-running the corrected check
        # against every migration file with a real REAL/FLOAT/DOUBLE column
        # injected as a negative test.
        run: |
          ! find migrations/finance/ migrations/0057_finance_merge.sql -type f -name '*.sql' \
            -exec sh -c "sed 's/--.*\$//' \"\$1\" | grep -niE '\\b(REAL|FLOAT|DOUBLE)\\b'" _ {} \; \
            2>/dev/null | grep -q . || exit 1
      - name: guard - BH-13 intact
        run: |
          grep -q 'BH-13' src/engines/burden.test.ts
          grep -q '40.62' src/engines/burden.test.ts
          grep -q 'not.toBe(39.49)' src/engines/burden.test.ts
      - name: guard - node_modules not tracked
        run: |
          ! git ls-files | grep -qx 'node_modules' || exit 1
      - run: npm run typecheck
      - run: npm test
      - name: install Playwright chromium
        # Deliberately NOT --with-deps. That flag runs apt-get against Ubuntu
        # mirrors, which is the slowest part of this job and the only part that
        # can hang: it retried an unreachable azure.archive.ubuntu.com for over
        # two hours on 2026-08-19.
        #
        # The runner image already carries Chromium's system libraries, and the
        # suite this installs for (npm run e2e) turned out not to launch a
        # browser at all — those specs drive Hono at the request level and pass
        # in 8.7s locally with no browser present. The download stays because
        # playwright.config.ts still declares a chromium project.
        run: npx playwright install chromium
      - name: apply migrations (local D1)
        # Single database since migrations/0057_finance_merge.sql (2026-08-09)
        # — one migrations_dir, one apply step.
        run: npm run db:migrate:local
      - run: npm run e2e
