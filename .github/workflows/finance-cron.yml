name: Finance OS Nightly Rollup

# Option B (chosen 2026-08-04) — see workers/finance-cron/README.md for the
# rejected Option A (companion Cloudflare Worker) and why B was picked:
# reuses this repo's existing GitHub Actions setup instead of deploying and
# maintaining a second Cloudflare Worker for a once-a-day HTTP call.
#
# Full operational runbook (setup, verification, secret rotation, failure
# triage): docs/RUNBOOK-finance-cron.md
#
# Setup required before this can succeed (not done by this workflow file):
#   1. Generate a random secret value yourself, e.g.:
#        openssl rand -hex 32
#   2. Add it as a GitHub Actions secret on this repo, named CRON_SECRET:
#        Settings -> Secrets and variables -> Actions -> New repository secret
#   3. Set the SAME value as the Cloudflare Pages secret:
#        wrangler pages secret put CRON_SECRET --project-name groundwork-crm
#   Until both are set to the same value, every run of this workflow will
#   fail (401 if the values don't match; 503 if Cloudflare's side was never
#   set at all — see src/api/cron-trigger.ts).

on:
  schedule:
    # 7am UTC daily. GitHub's schedule trigger is best-effort (can run a
    # few minutes late under load) — fine for a once-daily rollup. Change
    # the cron expression to whatever time you prefer.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and return results without writing recovery_snapshot (safe to run anytime)'
        type: boolean
        default: false
      as_of:
        description: 'Roll up for a specific date (YYYY-MM-DD) instead of today. For backfilling missed nights — the write is an upsert keyed on (company_id, as_of), so re-running a date is safe.'
        type: string
        default: ''

jobs:
  trigger-rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Fix plan item 6: needed so the failure-notification step below can
    # open/update a GitHub issue with the default GITHUB_TOKEN — no new
    # secret required. Read-only otherwise; only 'issues: write' is added
    # beyond the repo's default read permissions.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Call Finance OS rollup endpoint
        id: rollup
        run: |
          url="https://groundwork-crm.com/internal/cron/rollup"
          sep="?"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            url="${url}${sep}dry_run=true"; sep="&"
            echo "Dry run — no data will be written."
          fi
          # Backfill support. Every query in gather-inputs.ts is bounded at both
          # ends by as_of, so a past date produces that date's numbers rather
          # than today's under an old label — which is what it did before
          # 2026-08-19 and the reason backfilling was not safe until now.
          if [ -n "${{ inputs.as_of }}" ]; then
            case "${{ inputs.as_of }}" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
              *) echo "::error::as_of must be YYYY-MM-DD"; exit 1 ;;
            esac
            url="${url}${sep}as_of=${{ inputs.as_of }}"
            echo "Rolling up for ${{ inputs.as_of }} rather than today."
          fi
          http_status=$(curl -s -o /tmp/rollup_response.json -w "%{http_code}" -X POST \
            --retry 2 --retry-delay 5 --max-time 60 \
            "$url" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}")
          echo "HTTP status: $http_status"
          cat /tmp/rollup_response.json
          echo
          if [ "$http_status" -ne 200 ]; then
            echo "::error::Rollup endpoint returned $http_status (expected 200) — see response body above, and docs/RUNBOOK-finance-cron.md for triage."
            exit 1
          fi

      # Fix plan item 6 ("Prevent silent CRON_SECRET drift from recurring"):
      # a scheduled Action failing on its own only produces a red X in the
      # Actions tab that nobody watches. This step runs ONLY on failure
      # (of the step above) and ONLY for the real schedule trigger (never
      # for a manual workflow_dispatch dry run, which fails loudly to
      # whoever is already watching it run) — it opens (or reuses, via a
      # stable title) a GitHub issue so the failure surfaces as an
      # actionable, assignable, notifying-by-default artifact instead of
      # something you only notice by checking the Actions tab days later.
      # See docs/RUNBOOK-finance-cron.md "If a scheduled run fails".
      - name: Open/update an issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Finance OS Nightly Rollup failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The scheduled nightly rollup failed on ${new Date().toISOString().slice(0, 10)}.`,
              '',
              `Run: ${runUrl}`,
              '',
              'Most likely causes, in order — see docs/RUNBOOK-finance-cron.md "If a scheduled run fails":',
              '- **401** — the GitHub Actions and Cloudflare Pages `CRON_SECRET` values no longer match.',
              '- **503** — `CRON_SECRET` was never set (or was cleared) on the Cloudflare Pages side.',
              '- Anything else — check the run log above for the response body.',
              '',
              'This issue is reused (not duplicated) across consecutive failing nights — closing it is safe;',
              'the next failure reopens it rather than piling up duplicates.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              labels: 'finance-cron-failure',
            });
            const match = existing.data.find((i) => i.title === title);

            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                state: 'open',
                body,
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body: `Failed again — see run: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['finance-cron-failure'],
              });
            }
