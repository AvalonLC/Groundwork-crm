name: Apply Finance OS D1 Migrations (manual only)

# Deliberately NOT triggered by `push`. FINANCE_DB holds real per-tenant
# financial data with no staging environment (see CLAUDE.md's "NEVER run
# wrangler ... --remote -- Tyler runs those himself while awake"). Native
# GitHub "required reviewers" environment protection needs a paid plan tier
# this repo doesn't have, so the gate here is structural instead: this
# workflow only ever runs when a human explicitly clicks "Run workflow" (or
# runs `gh workflow run finance-db-migrate.yml`) on the Actions tab, after
# reviewing what migrations/finance/*.sql would apply. `deploy.yml` never
# calls this -- pushing code to main does not apply Finance OS migrations.
#
# migrations/finance/ is additive-only (numbered files, never edited after
# merge -- see CLAUDE.md), so re-running this after a new migration lands
# only ever applies the new file(s); already-applied migrations are no-ops.

on:
  workflow_dispatch:

jobs:
  apply-finance-migrations:
    name: Apply Finance OS D1 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Finance OS D1 migrations
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: d1 migrations apply groundwork --remote
